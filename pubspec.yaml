name: ukil_chaai
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.2
  go_router: 18.0.0
  dio: ^5.11.0
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  flutter_secure_storage: ^11.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^7.3.1
  flutter_localizations:
    sdk: flutter
  intl: any
  image_picker: ^1.2.2
  table_calendar: ^3.2.1

  skeletonizer:
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons:
  rename_app: ^1.6.6
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/launcher/ukil-chaai.png"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  generate: true

  assets:
    - assets/clip/
    - assets/icon/
    - assets/launcher/
    - assets/onboard/

