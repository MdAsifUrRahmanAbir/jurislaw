name: ukil_chaai_client
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management & Routing
  get: ^4.6.5

  # Local Storage (get_storage — faster than SharedPreferences, matches Remitium pattern)
  get_storage: ^2.1.1

  # SharedPreferences (for onboarding screen)
  shared_preferences: ^2.2.3

  # HTTP Client (matches Remitium's ApiMethod which uses http package)
  http: ^1.2.0

  # Logging (typed per-class logger, matches Remitium)
  logger: ^2.4.0

  # Fonts
  google_fonts: 8.2.1

  # UI / Widgets
  pinput: 6.0.2                  # For OTP / Pin Code
  table_calendar: 3.2.1           # For calendar widget
  intl:                   # For date formatting
  cached_network_image: ^3.2.3    # For network images in avatar or cards
  flutter_svg: ^2.1.1             # For SVG icons
  url_launcher: ^6.1.11           # For opening external URLs
  fluttertoast: 10.0.0             # Optional: for toast messages
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/onboard/onboard1.png
    - assets/onboard/onboard2.png
    - assets/onboard/onboard3.png

